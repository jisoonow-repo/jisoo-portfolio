};

function useTypewriter(text, speed = 28, trigger = true) {
  const [displayed, setDisplayed] = useState("");
  const [done, setDone] = useState(false);
  useEffect(() => {
    if (!trigger) { setDisplayed(""); setDone(false); return; }
    setDisplayed(""); setDone(false); let i = 0;
    const iv = setInterval(() => { i++; setDisplayed(text.slice(0, i)); if (i >= text.length) { clearInterval(iv); setDone(true); } }, speed);
    return () => clearInterval(iv);
  }, [text, trigger]);
  return { displayed, done };
}

// Animates rich JSX content by tracking total chars revealed.
// segments: array of { text, bold? }
// Returns { count } — number of chars currently visible.
function useRichTypewriter(segments, speed = 6, trigger = true) {
  const total = segments.reduce((s, seg) => s + seg.text.length, 0);
  const [count, setCount] = useState(0);
  useEffect(() => {
    if (!trigger) { setCount(0); return; }
    setCount(0);
    let c = 0;
    const iv = setInterval(() => {
      c++;
      setCount(c);
      if (c >= total) clearInterval(iv);
    }, speed);
    return () => clearInterval(iv);
  }, [trigger, total, speed]);

  // Render only the revealed portion, preserving bold/normal per segment
  let remaining = count;
  const nodes = [];
  for (let i = 0; i < segments.length; i++) {
    const seg = segments[i];
    if (remaining <= 0) break;
    const visible = seg.text.slice(0, remaining);
    remaining -= seg.text.length;
    if (seg.bold) {
      nodes.push(<strong key={i}>{visible}</strong>);
    } else {
      nodes.push(<span key={i}>{visible}</span>);
    }
  }
  return { nodes, done: count >= total };
}


function FadeIn({ children, delay = 0, show = true }) {
  const [vis, setVis] = useState(false);
  useEffect(() => { if (!show) { setVis(false); return; } const t = setTimeout(() => setVis(true), delay); return () => clearTimeout(t); }, [show, delay]);
  return <div style={{ opacity: vis ? 1 : 0, transform: vis ? "translateY(0)" : "translateY(6px)", transition: "opacity 0.35s, transform 0.35s" }}>{children}</div>;
}

/* ─── Reap AI Button — canvas-drawn rotating conic gradient border ─── */
function ReapAIButton({ onClick, animated }) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const angleRef = useRef(0);

  useEffect(() => {
    if (!animated) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;

    function draw() {
      const W = canvas.width / dpr;
      const H = canvas.height / dpr;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const r = H / 2;           // pill corner radius = half height
      const strokeW = 1.5;
      const cx = W / 2, cy = H / 2;

      // Build conic gradient centered on the pill
      // Colors from video: purple → blue → cyan → purple (full loop)
      const grad = ctx.createConicGradient(
        (angleRef.current * Math.PI) / 180,  // start angle in radians
        cx * dpr, cy * dpr
      );
      grad.addColorStop(0,    "#7C3AED");   // purple
      grad.addColorStop(0.25, "#3B82F6");   // blue
      grad.addColorStop(0.5,  "#06B6D4");   // cyan
      grad.addColorStop(0.75, "#7C3AED");   // purple again
      grad.addColorStop(1,    "#06B6D4");   // cyan to close loop

      // Draw pill-shaped stroke
      ctx.save();
      ctx.scale(dpr, dpr);
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(W - r, 0);
      ctx.arcTo(W, 0, W, r, r);
      ctx.lineTo(W, H - r);
      ctx.arcTo(W, H, W - r, H, r);
      ctx.lineTo(r, H);
      ctx.arcTo(0, H, 0, H - r, r);
      ctx.lineTo(0, r);
      ctx.arcTo(0, 0, r, 0, r);
      ctx.closePath();

      ctx.strokeStyle = grad;
      ctx.lineWidth = strokeW;
      ctx.stroke();
      ctx.restore();

      // Advance angle — full rotation in ~3s at 60fps
      angleRef.current = (angleRef.current + 360 / (3 * 60)) % 360;
      rafRef.current = requestAnimationFrame(draw);
    }

    // Size canvas to match button
    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width  = rect.width  * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width  = rect.width  + "px";
      canvas.style.height = rect.height + "px";
    }
    resize();
    draw();
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [animated]);

  return (
    <button onClick={onClick} style={{
      position: "relative", display: "inline-flex", alignItems: "center", gap: 7,
      padding: "8px 18px 8px 14px", background: "white", border: "none",
      borderRadius: 999, cursor: "pointer", fontSize: 14, fontWeight: 500,
      color: "#09090B", fontFamily: "inherit",
    }}>
      {/* Static border for non-animated state */}
      {!animated && (
        <div style={{
          position: "absolute", inset: 0, borderRadius: 999,
          border: "1.5px solid #E4E4E7", pointerEvents: "none",
        }}/>
      )}
      {/* Canvas border for animated state */}
      {animated && (
        <canvas ref={canvasRef} style={{
          position: "absolute", inset: 0, borderRadius: 999,
          pointerEvents: "none",
        }}/>
      )}
      {/* White fill so content isn't obscured */}
      <div style={{ position: "absolute", inset: 1.5, borderRadius: 999, background: "white", zIndex: 0 }}/>
      <span style={{ position: "relative", zIndex: 1, display: "flex" }}><SparkleIcon size={18}/></span>
      <span style={{ position: "relative", zIndex: 1 }}>Reap AI</span>
    </button>
  );
}

/* ─── Agent Activity ─── */
function AgentActivity({ running, completed }) {
  const [s1, setS1] = useState(false);
  const [s2, setS2] = useState(false);
  const [open, setOpen] = useState(true);

  useEffect(() => {
    if (running) { setS1(true); setS2(false); }
    if (completed) {
      setS1(true);
      // Step 2 completes at 400ms, then collapse at 700ms — tight & snappy
      const t1 = setTimeout(() => setS2(true), 400);
      const t2 = setTimeout(() => setOpen(false), 700);
      return () => { clearTimeout(t1); clearTimeout(t2); };
    }
  }, [running, completed]);

  return (
    <div style={{ marginBottom: 8 }}>
      <button onClick={() => setOpen(!open)} style={{ display: "flex", alignItems: "center", gap: 8, background: "none", border: "none", cursor: "pointer", padding: 0, fontFamily: "inherit" }}>
        <span style={{ fontSize: 12, color: "#71717A" }}>Agent activity</span>
        <span style={{ fontSize: 11, fontWeight: 600, padding: "2px 8px", borderRadius: 10, background: completed ? "#DCFCE7" : "#DBEAFE", color: completed ? "#16A34A" : "#2563EB" }}>
          {completed ? "Completed" : "Running"}
        </span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style={{ color: "#A1A1AA", transform: open ? "rotate(180deg)" : "rotate(-90deg)", transition: "transform 0.25s ease" }}><path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </button>
      {/* Smooth animated collapse via max-height */}
      <div style={{
        overflow: "hidden",
        maxHeight: open ? 120 : 0,
        opacity: open ? 1 : 0,
        transition: "max-height 0.3s ease, opacity 0.25s ease",
      }}>
        <div style={{ marginLeft: 8, marginTop: 8, paddingLeft: 12, borderLeft: "1.5px solid #E4E4E7" }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: "#52525B", marginBottom: 6 }}>Card agent</div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 5 }}>
            {s1 ? <CheckIcon/> : <div style={{ width: 18, height: 18, borderRadius: "50%", border: "1.5px solid #D1D5DB", flexShrink: 0 }}/>}
            <span style={{ fontSize: 12, color: "#3F3F46" }}>Fetching Reap Cards</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            {s2 ? <CheckIcon/> : running
              ? <div style={{ width: 18, height: 18, borderRadius: "50%", border: "2px solid #E5E7EB", borderTopColor: "#7C3AED", animation: "spin 0.8s linear infinite", flexShrink: 0 }}/>
              : <div style={{ width: 18, height: 18, borderRadius: "50%", border: "1.5px solid #D1D5DB", flexShrink: 0 }}/>
            }
            <span style={{ fontSize: 12, color: "#3F3F46" }}>Validating required fields</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── PromptBox with Context Selection Dropdown ─── */
function PromptBox({ step, onSubmit }) {
  const [open, setOpen] = useState(false);
  const [selected, setSelected] = useState("reap");
  const [inputText, setInputText] = useState("");
  const dropdownRef = useRef(null);
  const textareaRef = useRef(null);

  // Auto-resize textarea
  useEffect(() => {
    const el = textareaRef.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 68) + "px";
  }, [inputText]);

  // Close dropdown when clicking outside
  useEffect(() => {
    function handleClick(e) {
      if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
        setOpen(false);
      }
    }
    if (open) document.addEventListener("mousedown", handleClick);

/* ─── Card Creation Activity ─── */
function CardCreationActivity({ active, done }) {
  // 3 sequential steps: each takes ~1s to complete
  const [step1, setStep1] = useState(false); // Validating card details
  const [step2, setStep2] = useState(false); // Creating virtual card
  const [step3, setStep3] = useState(false); // Sending cardholder notification
  const [open, setOpen] = useState(true);

  useEffect(() => {
    if (!active && !done) { setStep1(false); setStep2(false); setStep3(false); setOpen(true); return; }
    if (active || done) {
      const t1 = setTimeout(() => setStep1(true), 500);
      const t2 = setTimeout(() => setStep2(true), 1400);
      const t3 = setTimeout(() => setStep3(true), 2400);
      // Collapse after all done
      const t4 = setTimeout(() => setOpen(false), 3200);
      return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); clearTimeout(t4); };
    }
  }, [active, done]);

  const steps = [
    { label: "Validating card details", done: step1 },
    { label: "Creating virtual card",   done: step2 },
    { label: "Notifying cardholder",    done: step3 },
  ];

  const allDone = step1 && step2 && step3;

  return (
    <div style={{ marginBottom: 8 }}>
      <button
        onClick={() => setOpen(v => !v)}
        style={{ display: "flex", alignItems: "center", gap: 8, background: "none", border: "none", cursor: "pointer", padding: 0, fontFamily: "inherit" }}
      >
        <span style={{ fontSize: 12, color: "#71717A" }}>Agent activity</span>
        <span style={{
          fontSize: 11, fontWeight: 600, padding: "2px 8px", borderRadius: 10,
          background: allDone ? "#DCFCE7" : "#DBEAFE",
          color: allDone ? "#16A34A" : "#2563EB",
        }}>
          {allDone ? "Completed" : "Running"}
        </span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
          style={{ color: "#A1A1AA", transform: open ? "rotate(180deg)" : "rotate(-90deg)", transition: "transform 0.25s ease" }}>
          <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </button>

      {/* Smooth collapse */}
      <div style={{
        overflow: "hidden",
        maxHeight: open ? 200 : 0,
        opacity: open ? 1 : 0,
        transition: "max-height 0.3s ease, opacity 0.25s ease",
      }}>
        <div style={{ marginLeft: 8, marginTop: 8, paddingLeft: 12, borderLeft: "1.5px solid #E4E4E7" }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: "#52525B", marginBottom: 6 }}>Card agent</div>
          {steps.map((s, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: i < steps.length - 1 ? 5 : 0 }}>
              {s.done ? (
                <CheckIcon />
              ) : (active || done) ? (
                <div style={{ width: 18, height: 18, borderRadius: "50%", border: "2px solid #E5E7EB", borderTopColor: "#7C3AED", animation: "spin 0.8s linear infinite", flexShrink: 0 }}/>
              ) : (
                <div style={{ width: 18, height: 18, borderRadius: "50%", border: "1.5px solid #D1D5DB", flexShrink: 0 }}/>
              )}
              <span style={{ fontSize: 12, color: s.done ? "#3F3F46" : "#71717A" }}>{s.label}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

    const spacerHeight = window.innerHeight * 0.16;
    const distanceToBottom = el.scrollHeight - el.scrollTop - el.clientHeight;
    const hasMore = distanceToBottom > spacerHeight + 20;
    setShowScrollDown(hasMore);

                      { icon: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style={{color:"#09090B"}}><path d="M21.5 4.5C21.5 5.60457 20.6046 6.5 19.5 6.5C18.3954 6.5 17.5 5.60457 17.5 4.5C17.5 3.39543 18.3954 2.5 19.5 2.5C20.6046 2.5 21.5 3.39543 21.5 4.5Z" stroke="currentColor" strokeWidth="1.5"/>
<path d="M20.4711 9.40577C20.5 10.2901 20.5 11.3119 20.5 12.5C20.5 16.7426 20.5 18.864 19.182 20.182C17.864 21.5 15.7426 21.5 11.5 21.5C7.25736 21.5 5.13604 21.5 3.81802 20.182C2.5 18.864 2.5 16.7426 2.5 12.5C2.5 8.25736 2.5 6.13604 3.81802 4.81802C5.13604 3.5 7.25736 3.5 11.5 3.5C12.6881 3.5 13.7099 3.5 14.5942 3.52895" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
<path d="M6.5 14.5L9.29289 11.7071C9.68342 11.3166 10.3166 11.3166 10.7071 11.7071L12.2929 13.2929C12.6834 13.6834 13.3166 13.6834 13.7071 13.2929L16.5 10.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>, label: "Unfreeze a card" },
                      { icon: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style={{color:"#09090B"}}><path d="M21 6C21 7.65685 19.6569 9 18 9C16.3431 9 15 7.65685 15 6C15 4.34315 16.3431 3 18 3C19.6569 3 21 4.34315 21 6Z" stroke="currentColor" strokeWidth="1.5"/>
<path d="M21 18C21 19.6569 19.6569 21 18 21C16.3431 21 15 19.6569 15 18C15 16.3431 16.3431 15 18 15C19.6569 15 21 16.3431 21 18Z" stroke="currentColor" strokeWidth="1.5"/>
<path d="M15 8L3 19" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
<path d="M15.0003 16L11 12" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
<path d="M3 5.00011L8.5 10" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>, label: "Terminate a card" },
                      { icon: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style={{color:"#09090B"}}><path d="M13 20.8268V22H14.1734C14.5827 22 14.7874 22 14.9715 21.9238C15.1555 21.8475 15.3003 21.7028 15.5897 21.4134L20.4133 16.5894C20.6864 16.3164 20.8229 16.1799 20.8959 16.0327C21.0347 15.7525 21.0347 15.4236 20.8959 15.1434C20.8229 14.9961 20.6864 14.8596 20.4133 14.5866C20.1403 14.3136 20.0038 14.1771 19.8565 14.1041C19.5763 13.9653 19.2473 13.9653 18.9671 14.1041C18.8198 14.1771 18.6833 14.3136 18.4103 14.5866L18.4103 14.5866L13.5867 19.4106C13.2972 19.7 13.1525 19.8447 13.0762 20.0287C13 20.2128 13 20.4174 13 20.8268Z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/>
<path d="M19 11C19 11 19 9.4306 18.8478 9.06306C18.6955 8.69552 18.4065 8.40649 17.8284 7.82843L13.0919 3.09188C12.593 2.593 12.3436 2.34355 12.0345 2.19575C11.9702 2.165 11.9044 2.13772 11.8372 2.11401C11.5141 2 11.1614 2 10.4558 2C7.21082 2 5.58831 2 4.48933 2.88607C4.26731 3.06508 4.06508 3.26731 3.88607 3.48933C3 4.58831 3 6.21082 3 9.45584V14C3 17.7712 3 19.6569 4.17157 20.8284C5.23467 21.8915 6.8857 21.99 10 21.9991M12 2.5V3C12 5.82843 12 7.24264 12.8787 8.12132C13.7574 9 15.1716 9 18 9H18.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>, label: "Summarize card spending" },
                      { icon: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style={{color:"#09090B"}}><path d="M6.08938 14.9992C5.71097 14.1486 5.5 13.2023 5.5 12.2051C5.5 8.50154 8.41015 5.49921 12 5.49921C15.5899 5.49921 18.5 8.50154 18.5 12.2051C18.5 13.2023 18.289 14.1486 17.9106 14.9992" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
<path d="M12 1.99921V2.99921" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
<path d="M22 11.9992H21" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
<path d="M3 11.9992H2" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
<path d="M19.0704 4.92792L18.3633 5.63503" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
<path d="M5.6368 5.636L4.92969 4.92889" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
<path d="M14.517 19.3056C15.5274 18.9788 15.9326 18.054 16.0466 17.1238C16.0806 16.8459 15.852 16.6154 15.572 16.6154L8.47685 16.6156C8.18725 16.6156 7.95467 16.8614 7.98925 17.1489C8.1009 18.0773 8.3827 18.7555 9.45345 19.3056M14.517 19.3056C14.517 19.3056 9.62971 19.3056 9.45345 19.3056M14.517 19.3056C14.3955 21.2506 13.8338 22.0209 12.0068 21.9993C10.0526 22.0354 9.60303 21.0833 9.45345 19.3056" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>, label: "Tell me what you can do" },
                    ].map(({ icon, label, action }) => (
                      <button key={label} onClick={action} style={{
                        display: "flex", alignItems: "center", gap: 10,
                        padding: "8px 8px", background: "none", border: "none",
                        borderRadius: 6, cursor: "pointer", fontFamily: "inherit",
                        fontSize: 16, color: "#09090B", textAlign: "left", width: "100%",
                        transition: "background 0.15s",
                      }}
                      onMouseEnter={e => e.currentTarget.style.background = "#F5F3FF"}
                      onMouseLeave={e => e.currentTarget.style.background = "none"}
                      >
                        <span style={{ flexShrink: 0, display: "flex" }}>{icon}</span>
                        <span style={{ lineHeight: "24px" }}>{label}</span>
                      </button>
                    ))}
                  </div>
                  {/* Info alert strip */}
                  <div style={{
                    display: "flex", alignItems: "center", gap: 12,
                    background: "#F5F3FF", borderRadius: 12, padding: "16px",
                  }}>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style={{color:"#6D28D9", flexShrink:0}}><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
<path d="M12 16V12" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
<path d="M12.125 8.25H12M12.25 8.25C12.25 8.11193 12.1381 8 12 8C11.8619 8 11.75 8.11193 11.75 8.25C11.75 8.38807 11.8619 8.5 12 8.5C12.1381 8.5 12.25 8.38807 12.25 8.25Z" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                    <span style={{ fontSize: 13, color: "#6D28D9", lineHeight: "19.5px" }}>Reap AI is currently available for Reap Card support.</span>
                  </div>
                </FadeIn>
              </div>
            )}

            {/* CHAT MESSAGES — shown after user starts */}
            {step !== STEPS.DRAWER_DEFAULT && (
              <div style={{ flex: 1, padding: "16px 24px", display: "flex", flexDirection: "column" }}>
                {si>=STEP_ORDER.indexOf(STEPS.USER_PROMPT)&&<FadeIn show delay={100}><Bubble from="user">{userMessages.prompt||"Create a new virtual card"}</Bubble></FadeIn>}
                {si>=STEP_ORDER.indexOf(STEPS.AI_ASKS)&&<FadeIn show delay={300}><Bubble from="ai">
                  <div style={{fontSize:15,color:"#09090B",lineHeight:1.6}}>
                    <div>{askIntro.displayed}{!askIntro.done&&<span style={{animation:"pulse 1s infinite"}}>|</span>}</div>
                    {(askBullets.nodes.length > 0 || askIntro.done) && (
                      <div style={{whiteSpace:"pre-wrap",marginTop:8}}>
                        {askBullets.nodes}{!askBullets.done&&<span style={{animation:"pulse 1s infinite"}}>|</span>}
                      </div>
                    )}
                  </div>
                </Bubble></FadeIn>}
                {si>=STEP_ORDER.indexOf(STEPS.USER_REPLY_1)&&<FadeIn show delay={100}><Bubble from="user">{userMessages.reply1||("For Jisoo Ahn - jisoo.ahn@reap.hk\nCard title: " + (cardOverrides.title||"Figma subscription"))}</Bubble></FadeIn>}
                {si>=STEP_ORDER.indexOf(STEPS.AI_ASKS_PURPOSE)&&<FadeIn show delay={400}><Bubble from="ai"><div style={{fontSize:15,color:"#09090B"}}>{purposeMsg.displayed}{!purposeMsg.done&&<span style={{animation:"pulse 1s infinite"}}>|</span>}</div></Bubble></FadeIn>}
                {si>=STEP_ORDER.indexOf(STEPS.USER_REPLY_2)&&<FadeIn show delay={100}><Bubble from="user">{userMessages.reply2||cardOverrides.title||"SaaS subscription"}</Bubble></FadeIn>}
                {si>=STEP_ORDER.indexOf(STEPS.AI_ASKS_LIMITS)&&<FadeIn show delay={400}><Bubble from="ai">
                  <div style={{fontSize:15,color:"#09090B",lineHeight:1.6}}>
                    {limitsMsg.nodes}{!limitsMsg.done&&<span style={{animation:"pulse 1s infinite"}}>|</span>}
                  </div>
                </Bubble></FadeIn>}
                {si>=STEP_ORDER.indexOf(STEPS.USER_REPLY_3)&&<FadeIn show delay={100}><Bubble from="user">{userMessages.reply3||"HK 4000 per month and HKD 40000 per year"}</Bubble></FadeIn>}
                {si>=STEP_ORDER.indexOf(STEPS.AGENT_RUNNING)&&<FadeIn show delay={200}><div ref={agentDoneRef} style={{marginTop:8}}><AgentActivity running={step===STEPS.AGENT_RUNNING} completed={si>=STEP_ORDER.indexOf(STEPS.AGENT_DONE)}/></div></FadeIn>}
                {si>=STEP_ORDER.indexOf(STEPS.AGENT_DONE)&&<FadeIn show delay={500}><div>
                  <div style={{fontSize:15,lineHeight:1.6,color:"#09090B",marginBottom:6}}>{reviewMsg.displayed}{!reviewMsg.done&&<span style={{animation:"pulse 1s infinite"}}>|</span>}</div>
                  <CardForm showEdit={step !== STEPS.SUCCESS && step !== STEPS.CARD_CREATING} cardOverrides={cardOverrides} editingField={editingField} onEdit={(k,v)=>{setEditingField(k);setEditValue(v);setStep(STEPS.EDIT_FIELD)}} onSave={()=>{setCardOverrides(prev=>({...prev,[editingField]:editValue}));setEditingField(null);setStep(STEPS.CONFIRM)}} onCancel={()=>{setEditingField(null);setStep(STEPS.CONFIRM)}} editValue={editValue} onEditChange={setEditValue}/>
                  {step!==STEPS.SUCCESS&&step!==STEPS.CARD_CREATING&&<FadeIn show delay={800}>
                    <div style={{display:"flex",gap:8,marginTop:8,marginBottom:20}}>
                      <button onClick={()=>setStep(STEPS.DASHBOARD)} style={{
                        padding:"8px 16px", fontSize:15, fontWeight:500,
                        border:"1px solid #E4E4E7", borderRadius:8,
                        background:"white", cursor:"pointer", fontFamily:"inherit", color:"#09090B",
                        lineHeight:"20px", height:36,
                      }}>Cancel</button>
                      <button
                        onClick={()=>setStep(STEPS.CARD_CREATING)}
                        disabled={!!editingField}
                        style={{
                          padding:"8px 16px", fontSize:15, fontWeight:500,
                          border:"none", borderRadius:8,
                          background: editingField ? "rgba(109,40,217,0.4)" : "#6D28D9",
                          color:"white", cursor: editingField ? "default" : "pointer",
                          fontFamily:"inherit", lineHeight:"20px", height:36,
                        }}
                      >Create card</button>
                    </div>
                  </FadeIn>}
                </div></FadeIn>}
                {(step===STEPS.CARD_CREATING||step===STEPS.SUCCESS)&&<FadeIn show delay={0}>
                  <div style={{marginTop:32}}>
                    <CardCreationActivity active={step===STEPS.CARD_CREATING} done={step===STEPS.SUCCESS}/>
                  </div>
                </FadeIn>}
                {step===STEPS.SUCCESS&&<FadeIn show delay={200}>
                  <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:32}}>
                    <div style={{fontSize:16,color:"#262626",lineHeight:"24px"}}>
                      Done. The card is ready to use. We've also informed the cardholder via email.
                    </div>
                    <div style={{display:"flex",gap:8}}>
                      <button style={{
                        padding:"8px 16px", fontSize:15, fontWeight:500, height:36,
                        border:"1px solid #E4E4E7", borderRadius:8,
                        background:"white", cursor:"pointer", fontFamily:"inherit", color:"#09090B",
                        lineHeight:"20px", whiteSpace:"nowrap",
                      }}>View card details</button>
                      <button style={{
                        padding:"8px 16px", fontSize:15, fontWeight:500, height:36,
                        border:"1px solid #E4E4E7", borderRadius:8,
                        background:"white", cursor:"pointer", fontFamily:"inherit", color:"#09090B",
                        lineHeight:"20px", whiteSpace:"nowrap",
                      }}>Create another card</button>
                    </div>
                  </div>
                </FadeIn>}
                <div ref={chatEndRef}/>
                {/* Bottom spacer — keeps content in upper 2/3 of viewport */}
                <div style={{ minHeight: "16vh", flexShrink: 0 }}/>
              </div>
            )}
          </div>

          {/* Scroll-to-bottom button — Claude style */}
          {showScrollDown && step !== STEPS.DRAWER_DEFAULT && (
            <div style={{ position: "relative", height: 0, zIndex: 5 }}>
              <div style={{ position: "absolute", bottom: 24, left: 0, right: 0, display: "flex", justifyContent: "center", pointerEvents: "none" }}>
                <button
                  onClick={() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }}
                  style={{
                    width: 32, height: 32, borderRadius: "50%",
                    background: "white", border: "1px solid #E4E4E7",
                    boxShadow: "0 1px 6px rgba(0,0,0,0.08)",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    cursor: "pointer", padding: 0, flexShrink: 0, pointerEvents: "auto",
                    transition: "background 0.15s, box-shadow 0.15s",
                  }}
                  onMouseEnter={e => { e.currentTarget.style.background = "#F4F4F5"; e.currentTarget.style.boxShadow = "0 2px 10px rgba(0,0,0,0.12)"; }}
                  onMouseLeave={e => { e.currentTarget.style.background = "white"; e.currentTarget.style.boxShadow = "0 1px 6px rgba(0,0,0,0.08)"; }}
                >
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style={{flexShrink:0}}>
                    <path d="M6 10L12 16L18 10" stroke="#71717A" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </button>
              </div>
            </div>
          )}


          {/* ── Prompt box — frosted glass, matches Figma PromptBox ── */}
          <PromptBox step={step} onSubmit={handlePromptSubmit} />
        </div>
      )}

    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(ReapAIPrototype));
</script>
</body>
</html>
